name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Temporary candidate contract while kdlbs/kandev#2872 is under review.
# Replace this fork SHA with the first released upstream tag containing that
# provider-neutral Task.Update contract before publishing the plugin.
env:
  KANDEV_SDK_REPOSITORY: yattdev/kandev
  KANDEV_SDK_REF: dcfe7c400719f0fc287b4e79e4b08ecb7afe717c

jobs:
  verify:
    name: Tidy, format, vet, and test
    runs-on: ubuntu-latest
    steps:
      # The local SDK replacement in go.mod expects these checkouts to be
      # siblings: plugin/../kandev/apps/backend.
      - name: Check out plugin
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: plugin

      - name: Check out kandev SDK contract
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ env.KANDEV_SDK_REPOSITORY }}
          path: kandev
          ref: ${{ env.KANDEV_SDK_REF }}
          sparse-checkout: |
            apps/backend
            apps/packages/plugin-sdk

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install UI test dependencies
        working-directory: plugin
        run: npm ci --include=dev

      - name: Check module files are tidy
        working-directory: plugin
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        working-directory: plugin
        run: |
          test -z "$(gofmt -l .)" || { echo "gofmt needed:"; gofmt -l .; exit 1; }

      - name: Vet
        working-directory: plugin
        run: make vet

      - name: Test
        working-directory: plugin
        run: make test test-ui

  candidate-contract:
    name: Server on candidate Kandev task-update contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugin
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: plugin

      - name: Check out candidate SDK contract
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ env.KANDEV_SDK_REPOSITORY }}
          path: kandev
          ref: ${{ env.KANDEV_SDK_REF }}
          sparse-checkout: apps/backend

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      - name: Test against candidate SDK
        working-directory: plugin
        run: go test ./server/...
